<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buckyball Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      
      /* Codex Light Theme */
      --bg-primary: #fdfdfc;
      --bg-secondary: #f4f6f6;
      --bg-sidebar: #eef2f1;
      --bg-hover: #e8eded;
      --border-color: #d9e0e0;
      --border-light: #e8eded;
      --text-primary: #20292f;
      --text-secondary: #5d6972;
      --text-muted: #8a9399;
      --accent-color: #009c83;
      --accent-hover: #007a66;
      --accent-bg: rgba(0, 156, 131, 0.08);
      --accent-border: rgba(0, 156, 131, 0.3);
      
      /* Status */
      --success-color: #07866f;
      --success-bg: rgba(7, 134, 111, 0.12);
      --warning-color: #b76b08;
      --warning-bg: rgba(183, 107, 8, 0.12);
      --danger-color: #be3b36;
      --danger-bg: rgba(190, 59, 54, 0.12);
      --info-color: #2679b9;
      --info-bg: rgba(38, 121, 185, 0.12);
      
      /* Shadows */
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
      
      /* Radius */
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-full: 9999px;
      
      /* Scrollbar */
      --scrollbar-size: 6px;
    }
    
    /* Dark Mode */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #18181c;
        --bg-secondary: #222226;
        --bg-sidebar: #1e1e22;
        --bg-hover: #2a2a30;
        --border-color: #3a3a42;
        --border-light: #2a2a30;
        --text-primary: #e3e3e8;
        --text-secondary: #a1a1aa;
        --text-muted: #71717a;
        --accent-color: #00bfa5;
        --accent-hover: #00d4b8;
        --accent-bg: rgba(0, 191, 165, 0.1);
        --accent-border: rgba(0, 191, 165, 0.35);
        
        --success-color: #34d399;
        --success-bg: rgba(52, 211, 153, 0.15);
        --warning-color: #fbbf24;
        --warning-bg: rgba(251, 191, 36, 0.12);
        --danger-color: #f87171;
        --danger-bg: rgba(248, 113, 113, 0.12);
        --info-color: #60a5fa;
        --info-bg: rgba(96, 165, 250, 0.15);
        
        --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
        --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
        --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
      }
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
    }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: var(--scrollbar-size); height: var(--scrollbar-size); }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    
    /* Selection */
    ::selection { background: var(--accent-bg); }
    
    /* Transitions */
    .transition { transition: all 0.15s ease; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" src="app.js"></script>
</body>
</html>
